name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC, os: ubuntu-latest, cc: gcc, cxx: g++, tools: build/ci }
          - { name: Linux Clang, os: ubuntu-latest, cc: clang, cxx: clang++, tools: build/ci }
          - { name: Windows MSVC, os: windows-latest, tools: build/ci/Release }
          # macos-15 runs on ARM, where compilers may fuse a * b + c. The other jobs run on x86-64,
          # so this one is the real check of the floating-point rules. Pinned because macos-latest
          # often got no runner in November 2026; try it again when updating the macOS version.
          - { name: macOS Clang, os: macos-15, tools: build/ci }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci --parallel
      - name: Test
        run: ctest --preset ci
      # Repeated with verbose output, because this log is the measurement of how far each platform
      # is from the reference bitstreams.
      - name: Show deviation from the reference bitstreams
        run: ctest --preset ci -R Conformance --verbose
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Robot Framework
        run: python -m pip install -r tests/e2e/requirements.txt
      - name: End-to-end tests
        run: python -m robot --variable TOOLS_DIR:${{ matrix.tools }} --outputdir build/robot tests/e2e

  sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize --parallel
      - name: Test
        run: ctest --preset sanitize
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Robot Framework
        run: python -m pip install -r tests/e2e/requirements.txt
      # The tools built with sanitizers, so that their whole path is checked and not only the library.
      - name: End-to-end tests
        run: python -m robot --variable TOOLS_DIR:build/sanitize --outputdir build/robot tests/e2e

  evaluation:
    name: Evaluation in Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci --parallel
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ffmpeg for the comparison with AAC and Opus
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install Python packages
        run: python -m pip install -r eval/requirements.txt
      - name: Test the evaluation
        run: python -m unittest discover --start-directory eval --verbose
        env:
          CODEC_TOOLS_DIR: build/ci
      - name: Run the evaluation
        run: python eval/evaluate.py --tools build/ci --out build/eval
      - uses: actions/upload-artifact@v7
        with:
          name: evaluation
          path: build/eval
          if-no-files-found: error

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
